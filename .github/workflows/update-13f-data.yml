name: Update 13F data

on:
  schedule:
    # Check daily at 10:23 China time; source dates advance only on real filings.
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-13f-data
  cancel-in-progress: false

jobs:
  update-data:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: guru-holdings-nextjs

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Confirm release branches agree
        working-directory: .
        run: |
          test "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)" || {
            echo '::error::main and master differ; refusing automatic publication.'
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: guru-holdings-nextjs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate latest 13F data
        run: npm run data:build
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

      - name: Sync readable stock routes
        run: npm run routes:sync

      - name: Check readable stock routes
        run: npm run routes:check

      - name: Check holdings change model
        run: npm run changes:check

      - name: Check freshness evidence boundaries
        run: npm run data:test

      - name: Verify SEC sources and hashes
        run: |
          node scripts/data/verify-13f.mjs > "$RUNNER_TEMP/sec-verification.json"
          node scripts/data/record-check.mjs "$RUNNER_TEMP/sec-verification.json"
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

      - name: Check translations
        run: npm run i18n:check

      - name: Check search identities and source content
        run: npm run seo:content:test

      - name: Check types
        run: npm run typecheck

      - name: Build site
        run: npm run build

      - name: Check multilingual SEO
        run: npm run seo:check

      - name: Commit generated data
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guru-holdings-nextjs/data-generated/snapshots/latest.json
          git add guru-holdings-nextjs/data-generated/reports/latest.md
          git add guru-holdings-nextjs/data-generated/freshness.json
          git add guru-holdings-nextjs/data-source/stock-slugs.json guru-holdings-nextjs/data-source/stock-route-aliases.json
          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
            exit 0
          fi
          git commit -m "Update generated 13F data"
          # Both refs update together, with normal fast-forward checks. A manual
          # release racing this job cannot be overwritten or leave split refs.
          git push --atomic origin HEAD:master HEAD:main
